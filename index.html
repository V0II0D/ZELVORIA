<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ZELVORIA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
<div id="top">
<button id="pause">Ⅱ</button>
<div>🪙 <span id="silver">0</span></div>
<div>🟡 <span id="gold">0</span></div>
<div>🌊 Волна <span id="wave">1</span></div>
<div>🏠 Ур. <span id="villageLevel">1</span></div>
</div>
<div id="world">
<div id="village">
<div id="mainBuilding">🏰</div>
<div class="building mine">⛏️</div>
<div class="building forge">⚒️</div>
<div class="building well">💧</div>
</div>
</div>
<div id="bottom">
<button id="gameShop">МАГАЗИН</button>
<button id="customShop">КАСТОМИЗАЦИЯ</button>
</div>
</div>
<script type="module" src="game/main.js"></script>
</body>
</html>
